name: Weekly community report

# オンデマンド（手動）で週報を生成する。定期スケジュールはしない。
# 対象期間は前回の週報生成時点（weekly_state.json）以降〜現在。
#
# 必要な設定:
#   - Secrets:   DISCORD_TOKEN, ANTHROPIC_API_KEY
#   - (任意) Variables: GUILD_ID, INTRO_CHANNEL_ID, EXCLUDE_CHANNEL_IDS
#     未設定の場合は下記 env のデフォルト値が使われる。

on:
  workflow_dispatch:
    inputs:
      since:
        description: "集計開始日 YYYY-MM-DD（省略時は前回の週報生成時点）"
        required: false
        type: string
      until:
        description: "集計終了日 YYYY-MM-DD（省略時は現在）"
        required: false
        type: string
      skip_report:
        description: "レポート生成をスキップ（指標のみ更新）"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: weekly-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Japanese font (for graph legend)
        run: sudo apt-get update && sudo apt-get install -y fonts-ipafont-gothic

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate weekly report
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GUILD_ID: ${{ vars.GUILD_ID || '1504714750557294682' }}
          INTRO_CHANNEL_ID: ${{ vars.INTRO_CHANNEL_ID || '1509451256962486385' }}
          EXCLUDE_CHANNEL_IDS: ${{ vars.EXCLUDE_CHANNEL_IDS }}
          TIMEZONE: Asia/Tokyo
        run: |
          python main.py --weekly \
            ${{ inputs.since && format('--since {0}', inputs.since) || '' }} \
            ${{ inputs.until && format('--until {0}', inputs.until) || '' }} \
            ${{ inputs.skip_report == true && '--skip-report' || '' }}

      - name: Commit updated metrics and state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metrics_history.csv metrics_graph.png weekly_state.json
          if git diff --cached --quiet; then
            echo "指標に変化がないためコミットをスキップします。"
          else
            git commit -m "Update community metrics (weekly report run)"
            git push origin "HEAD:${{ github.ref_name }}"
          fi

      - name: Upload reports
        if: ${{ inputs.skip_report != true }}
        uses: actions/upload-artifact@v4
        with:
          name: weekly-report
          path: reports/
          if-no-files-found: ignore
